<!doctype html>
<!--
  App Store screenshots, rendered by render.sh. One template, three devices (#device=…):
    iphone (default)  1320 x 2868, also scaled to 1206 x 2622; screens from docs/screenshots/ios
    ipad              2064 x 2752 (iPad 13-inch); screens from docs/screenshots/ipad
    duo               2853 x 2007 (iPhone Duo, inner display, open); screens from docs/screenshots/duo
  Open slides.html#lang=en&s=1&device=duo in a browser at the device's size to preview one slide.
-->
<html>
<head>
<meta charset="utf-8">
<title>Pairline App Store slide</title>
<style>
  @font-face { font-family: "Vazirmatn"; src: url("fonts/vazirmatn-nl-wght.woff2"); font-weight: 100 900; }

  :root {
    --navy: #0b1d3d;
    --blue: #1f5fbf;
    --sky: #6f9cf0;
    --green: #12b886;
    --ink-soft: #cddcfa;
    --latin: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; }
  body {
    font-family: var(--latin);
    color: #fff;
    background:
      radial-gradient(1100px 820px at 50% 1500px, rgba(111, 156, 240, 0.42), transparent 70%),
      radial-gradient(900px 600px at 50% -120px, rgba(18, 184, 134, 0.20), transparent 70%),
      linear-gradient(172deg, #0a1a38 0%, #12346f 46%, #1f5fbf 100%);
    -webkit-font-smoothing: antialiased;
  }
  body[data-lang="ar"] { font-family: "Vazirmatn", var(--latin); }

  /* The pairing motif: a faint dotted link across the canvas behind the phone. */
  .link {
    position: absolute; left: 0; right: 0; top: 1640px; height: 6px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 3px, transparent 3.5px) 0 0 / 34px 6px repeat-x;
  }
  .node { position: absolute; top: 1626px; width: 34px; height: 34px; border-radius: 50%; background: var(--green);
          box-shadow: 0 0 0 10px rgba(18, 184, 134, 0.22); }
  .node.l { left: 92px; } .node.r { right: 92px; }

  header {
    position: absolute; top: 150px; left: 90px; right: 90px; height: 520px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 34px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 14px 30px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.10); border: 2px solid rgba(255, 255, 255, 0.16);
    font-size: 38px; font-weight: 600; letter-spacing: 0.02em; color: #e6eeff;
  }
  .eyebrow::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--green); }
  h1 {
    margin: 0; white-space: pre-line;
    font-size: 122px; line-height: 1.04; font-weight: 800; letter-spacing: -0.025em;
  }
  body[data-lang="ar"] h1 { font-size: 112px; line-height: 1.28; letter-spacing: 0; font-weight: 700; }
  /* Turkish words run longer than English ones. */
  body[data-lang="tr"] h1 { font-size: 112px; }
  p.sub {
    margin: 0; max-width: 1060px;
    font-size: 50px; line-height: 1.32; font-weight: 500; color: var(--ink-soft);
  }
  body[data-lang="ar"] p.sub { font-size: 46px; line-height: 1.6; }

  /* The phone: a thin dark bezel around the real screen, with the Dynamic Island drawn on top. */
  .device {
    position: absolute; left: 50%; top: 742px; transform: translateX(-50%);
    width: 961px; height: 2028px; box-sizing: border-box; padding: 26px;
    border-radius: 152px; background: #05070c;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.16), 0 70px 140px rgba(2, 8, 24, 0.55);
  }
  .screen { position: relative; width: 909px; height: 1976px; border-radius: 126px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 100%; height: 100%; }
  .island {
    position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
    width: 282px; height: 84px; border-radius: 42px; background: #000;
  }

  /* iPad 13-inch, portrait: the same layout, a wider canvas and a thinner, squarer frame without the island. */
  html.ipad, html.ipad body { width: 2064px; height: 2752px; }
  html.ipad body {
    background:
      radial-gradient(1500px 1000px at 50% 1650px, rgba(111, 156, 240, 0.42), transparent 70%),
      radial-gradient(1300px 700px at 50% -120px, rgba(18, 184, 134, 0.20), transparent 70%),
      linear-gradient(172deg, #0a1a38 0%, #12346f 46%, #1f5fbf 100%);
  }
  html.ipad .link { top: 1722px; }
  html.ipad .node { top: 1708px; }
  html.ipad header { top: 140px; left: 140px; right: 140px; height: 600px; gap: 38px; }
  html.ipad .eyebrow { font-size: 50px; padding: 16px 36px; }
  html.ipad h1 { font-size: 156px; }
  html.ipad body[data-lang="ar"] h1 { font-size: 140px; }
  html.ipad body[data-lang="tr"] h1 { font-size: 144px; }
  html.ipad p.sub, html.duo p.sub { text-wrap: balance; }
  html.ipad p.sub { font-size: 62px; max-width: 1640px; }
  html.ipad body[data-lang="ar"] p.sub { font-size: 58px; }
  html.ipad .device { top: 842px; width: 1352px; height: 1785px; padding: 26px; border-radius: 76px; }
  html.ipad .screen { width: 1300px; height: 1733px; border-radius: 50px; }
  html.ipad .island { display: none; }

  /* iPhone Duo, open: the inner display in landscape, the copy on one line above it and the fold down the middle. */
  html.duo, html.duo body { width: 2853px; height: 2007px; }
  html.duo body {
    background:
      radial-gradient(1900px 900px at 50% 1250px, rgba(111, 156, 240, 0.42), transparent 70%),
      radial-gradient(1600px 520px at 50% -120px, rgba(18, 184, 134, 0.20), transparent 70%),
      linear-gradient(172deg, #0a1a38 0%, #12346f 46%, #1f5fbf 100%);
  }
  html.duo .link { top: 1234px; }
  html.duo .node { top: 1220px; }
  html.duo .node.l { left: 150px; } html.duo .node.r { right: 150px; }
  html.duo header { top: 96px; left: 160px; right: 160px; height: 420px; gap: 28px; }
  html.duo .eyebrow { font-size: 44px; padding: 14px 32px; }
  html.duo h1 { font-size: 132px; white-space: normal; }
  html.duo body[data-lang="ar"] h1 { font-size: 118px; line-height: 1.2; }
  html.duo body[data-lang="tr"] h1 { font-size: 124px; }
  html.duo p.sub { font-size: 56px; max-width: 2300px; }
  html.duo body[data-lang="ar"] p.sub { font-size: 52px; line-height: 1.5; }
  html.duo .device { top: 560px; width: 1912px; height: 1360px; padding: 26px; border-radius: 84px; }
  html.duo .screen { width: 1860px; height: 1308px; border-radius: 58px; }
  html.duo .island { display: none; }
  /* The fold: a faint crease down the middle of the inner display. */
  html.duo .screen::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 24px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.06) 40%, rgba(255, 255, 255, 0.10) 55%, transparent);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="link"></div><div class="node l"></div><div class="node r"></div>
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="device"><div class="screen"><img id="shot" alt=""><div class="island"></div></div></div>

<script>
// One entry per slide: the screen to show and its copy in each App Store language (English, Arabic, Turkish).
const SLIDES = [
  { shot: "04-messages",
    en: ["Messages", "Your Android SIM,\non your iPhone", "Texts, calls and codes from the phone that holds your SIM."],
    ar: ["الرسائل", "شريحة أندرويد\nعلى آيفونك", "الرسائل والمكالمات والرموز من الهاتف الذي يحمل شريحتك."],
    tr: ["Mesajlar", "Android SIM'iniz\niPhone'unuzda", "Mesajlar, aramalar ve kodlar, SIM kartınızın takılı olduğu telefondan."] },
  { shot: "06-incoming-call",
    en: ["Calls", "Answer calls\non your iPhone", "Calls to your Android number ring right on your iPhone."],
    ar: ["المكالمات", "أجب على المكالمات\nمن آيفونك", "مكالمات رقمك على أندرويد ترنّ على آيفونك مباشرةً."],
    tr: ["Aramalar", "Aramalar artık\niPhone'unuzda", "Android numaranıza gelen aramalar doğrudan iPhone'unuzda çalar."] },
  { shot: "05-one-time-code",
    en: ["One-time codes", "Codes in\none tap", "Verification codes are spotted and ready to copy."],
    ar: ["رموز التحقق", "الرموز\nبلمسة واحدة", "تُكتشف رموز التحقق وتصبح جاهزة للنسخ."],
    tr: ["Tek kullanımlık kodlar", "Kodlar\ntek dokunuşta", "Doğrulama kodları bulunur ve kopyalanmaya hazır olur."] },
  { shot: "07-contacts",
    en: ["Contacts", "Your contacts\ncome along", "Contacts and call history, synced from your Android phone."],
    ar: ["جهات الاتصال", "جهات اتصالك\nمعك دائمًا", "جهات الاتصال وسجل المكالمات متزامنة من هاتف أندرويد."],
    tr: ["Kişiler", "Kişileriniz\nyanınızda", "Kişiler ve arama geçmişi, Android telefonunuzdan eşitlenir."] },
  { shot: "08-bridge-status",
    en: ["Bridge", "Your bridge\nat a glance", "Battery, signal and both SIM cards, live."],
    ar: ["الهاتف الوسيط", "الهاتف الوسيط\nفي لمحة", "البطارية والإشارة وكلتا الشريحتين، مباشرةً."],
    tr: ["Köprü", "Köprü telefon\nbir bakışta", "Pil, sinyal ve iki SIM kart, anlık olarak."] },
  { shot: "09-privacy",
    en: ["Privacy", "Private\nby design", "End-to-end encrypted. No servers, no accounts, no tracking."],
    ar: ["الخصوصية", "الخصوصية\nفي الأساس", "تشفير تام بين هاتفيك. بلا خوادم ولا حسابات ولا تتبّع."],
    tr: ["Gizlilik", "Gizlilik\nen baştan", "Uçtan uca şifreli. Sunucu yok, hesap yok, izleme yok."] },
  { shot: "03-paywall",
    en: ["One-time purchase", "Pay once.\nKeep it.", "Try it free for a week. No subscription, ever."],
    ar: ["شراء لمرة واحدة", "ادفع مرة واحدة\nواحتفظ به", "جرّبه مجانًا لمدة أسبوع. بلا اشتراك أبدًا."],
    tr: ["Tek seferlik satın alma", "Bir kez ödeyin,\nsizin olsun", "Bir hafta ücretsiz deneyin. Abonelik yok."] },
];

const params = new URLSearchParams(location.hash.slice(1));
const lang = params.get("lang") || "en";
const device = ["ipad", "duo"].includes(params.get("device")) ? params.get("device") : "iphone";
const slide = SLIDES[(parseInt(params.get("s") || "1", 10) - 1)] || SLIDES[0];
const [eyebrow, title, sub] = slide[lang];
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
document.documentElement.classList.add(device);
document.body.dataset.lang = lang;
document.getElementById("eyebrow").textContent = eyebrow;
// The wide iPhone Duo canvas has room for the headline on one line.
document.getElementById("title").textContent = device === "duo" ? title.replace("\n", " ") : title;
document.getElementById("sub").textContent = sub;
const folder = { iphone: "ios", ipad: "ipad", duo: "duo" }[device];
document.getElementById("shot").src = `../screenshots/${folder}/${lang}/${slide.shot}.png`;
</script>
</body>
</html>
