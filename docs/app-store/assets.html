<!doctype html>
<!--
  App Store Asset Library images (iOS 27 product page), rendered by render.sh:
    assets.html#lang=en&kind=header  3840 x 1646 (21:9)  PRODUCT_PAGE_HEADER_ASSET: no text, three phones, centered
                                                          (the page crops it per device and puts round Back and Share
                                                          buttons over the top corners)
    assets.html#lang=en&kind=search  3840 x 2560 (3:2)   APP_STORE_SEARCH_RESULTS_ASSET: headline and two phones
  Apple's rules for both: no price, URL, copyright mark, awards or other platforms' logos; no alpha.
-->
<html>
<head>
<meta charset="utf-8">
<title>Pairline App Store asset</title>
<style>
  @font-face { font-family: "Vazirmatn"; src: url("fonts/vazirmatn-nl-wght.woff2"); font-weight: 100 900; }
  :root { --green: #12b886; --latin: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; overflow: hidden; }
  body {
    position: relative; color: #fff; font-family: var(--latin); -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(60% 70% at 50% 62%, rgba(111, 156, 240, 0.45), transparent 70%),
      radial-gradient(40% 40% at 50% -5%, rgba(18, 184, 134, 0.22), transparent 70%),
      linear-gradient(165deg, #0a1a38 0%, #12346f 50%, #1f5fbf 100%);
  }
  body[data-lang="ar"] { font-family: "Vazirmatn", var(--latin); }
  body.header { width: 3840px; height: 1646px; }
  body.search { width: 3840px; height: 2560px; }

  .link { position: absolute; left: 0; right: 0; height: 8px;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 4px, transparent 4.5px) 0 0 / 46px 8px repeat-x; }

  /* Same phone as slides.html (961 x 2028 at scale 1), scaled per placement. */
  .device {
    position: absolute; width: 961px; height: 2028px; box-sizing: border-box; padding: 26px;
    border-radius: 152px; background: #05070c; transform-origin: top left;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.16), 0 70px 140px rgba(2, 8, 24, 0.55);
  }
  .screen { position: relative; width: 909px; height: 1976px; border-radius: 126px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 100%; height: 100%; }
  .island { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 282px; height: 84px;
            border-radius: 42px; background: #000; }

  .copy { position: absolute; top: 0; bottom: 0; width: 1660px; display: flex; flex-direction: column;
          justify-content: center; gap: 56px; }
  .copy h1 { margin: 0; font-size: 168px; line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; white-space: pre-line; }
  body[data-lang="ar"] .copy h1 { font-size: 180px; line-height: 1.3; letter-spacing: 0; font-weight: 700; }
  .copy p { margin: 0; font-size: 84px; line-height: 1.3; font-weight: 500; color: #cddcfa; max-width: 1560px; }
  body[data-lang="ar"] .copy p { line-height: 1.6; }
  .copy .mark { display: flex; align-items: center; gap: 40px; font-size: 92px; font-weight: 700; color: #e6eeff; }
  .copy .mark img { width: 170px; height: 170px; border-radius: 38px; box-shadow: 0 20px 50px rgba(2, 8, 24, 0.45); }
</style>
</head>
<body>
<script>
const COPY = {
  en: ["Your Android SIM,\non your iPhone", "Texts, calls and one-time codes from the phone that holds your SIM."],
  ar: ["شريحة أندرويد\nعلى آيفونك", "الرسائل والمكالمات ورموز التحقق من الهاتف الذي يحمل شريحتك."],
  tr: ["Android SIM'iniz\niPhone'unuzda", "Mesajlar, aramalar ve tek kullanımlık kodlar, SIM kartınızın takılı olduğu telefondan."],
};
const params = new URLSearchParams(location.hash.slice(1));
const lang = params.get("lang") || "en";
const kind = params.get("kind") || "header";
const rtl = lang === "ar";
document.documentElement.lang = lang;
document.body.dataset.lang = lang;
document.body.className = kind;

const shot = (name) => `../screenshots/ios/${lang}/${name}.png`;
function phone(name, x, y, scale, z) {
  const d = document.createElement("div");
  d.className = "device";
  d.style.left = x + "px"; d.style.top = y + "px"; d.style.zIndex = z;
  d.style.transform = `scale(${scale})`;
  d.innerHTML = `<div class="screen"><img src="${shot(name)}" alt=""><div class="island"></div></div>`;
  document.body.appendChild(d);
}
function link(top) {
  const l = document.createElement("div");
  l.className = "link"; l.style.top = top + "px";
  document.body.appendChild(l);
}

if (kind === "header") {
  // Three phones rising from the bottom edge, the middle one in front. Everything stays in the middle half.
  link(980);
  const W = 961, H = 2028;
  const mid = 0.74, side = 0.62;
  const cx = 3840 / 2;
  phone("04-messages", cx - (W * mid) / 2, 110, mid, 3);
  const sideW = W * side;
  const gap = 140;
  const left = rtl ? "05-one-time-code" : "06-incoming-call";
  const right = rtl ? "06-incoming-call" : "05-one-time-code";
  phone(left, cx - (W * mid) / 2 - sideW + gap, 360, side, 2);
  phone(right, cx + (W * mid) / 2 - gap, 360, side, 2);
} else {
  // Headline on the reading side, two phones on the other; mirrored for Arabic.
  link(1720);
  const [title, sub] = COPY[lang];
  const copy = document.createElement("div");
  copy.className = "copy";
  copy.style[rtl ? "right" : "left"] = "200px";
  copy.dir = rtl ? "rtl" : "ltr";
  copy.innerHTML = `<div class="mark"><img src="../../ios/Pairline/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt=""><span>Pairline</span></div>
                    <h1></h1><p></p>`;
  copy.querySelector("h1").textContent = title;
  copy.querySelector("p").textContent = sub;
  document.body.appendChild(copy);
  const s = 1.02;
  const group = 961 * s * 1.78; // both phones, overlapping
  const base = rtl ? 145 : 3840 - 145 - group;
  phone("06-incoming-call", base, 420, s * 0.9, 2);
  phone("04-messages", base + 961 * s * 0.78, 300, s, 3);
}
</script>
</body>
</html>
