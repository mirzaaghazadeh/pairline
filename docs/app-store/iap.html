<!doctype html>
<!--
  Promotional images (1024 x 1024) for the two in-app purchases, rendered by render.sh: iap.html#kind=full and
  iap.html#kind=trial. No text, as Apple asks: the App Store shows each purchase's name and price next to the image.
-->
<html>
<head>
<meta charset="utf-8">
<title>Pairline in-app purchase image</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background:
      radial-gradient(520px 420px at 50% 46%, rgba(111, 156, 240, 0.45), transparent 70%),
      linear-gradient(160deg, #0a1a38 0%, #12346f 50%, #1f5fbf 100%);
  }
  .wrap { position: relative; width: 560px; height: 560px; }
  .icon {
    width: 560px; height: 560px; border-radius: 126px; display: block;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.14), 0 40px 90px rgba(2, 8, 24, 0.55);
  }
  .badge {
    position: absolute; right: -70px; bottom: -70px; width: 236px; height: 236px; border-radius: 50%;
    display: grid; place-items: center;
    box-shadow: 0 0 0 16px #12346f, 0 24px 50px rgba(2, 8, 24, 0.45);
  }
  .badge svg { width: 128px; height: 128px; }
  .full { background: #12b886; }
  .trial { background: #f59f00; }
  /* the faint dotted link from the screenshots */
  .link {
    position: absolute; left: 0; right: 0; top: 509px; height: 6px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 3px, transparent 3.5px) 0 0 / 34px 6px repeat-x;
  }
</style>
</head>
<body>
  <div class="link"></div>
  <div class="wrap">
    <img class="icon" src="../../ios/Pairline/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="">
    <div class="badge" id="badge"></div>
  </div>
<script>
const kind = new URLSearchParams(location.hash.slice(1)).get("kind") || "full";
const badge = document.getElementById("badge");
badge.className = "badge " + kind;
badge.innerHTML = kind === "trial"
  // a gift: box, lid and ribbon
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v7.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V12"/>'
    + '<path d="M12 8v12.5"/><path d="M12 8c-1.5-3.5-5.5-4-5.5-1.5S10 8 12 8z"/><path d="M12 8c1.5-3.5 5.5-4 5.5-1.5S14 8 12 8z"/></svg>'
  // owned for good: a check mark
  : '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
</script>
</body>
</html>
