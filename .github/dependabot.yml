# Dependabot opens pull requests that raise the versions of what we already use (D-101); it never adds anything new.
# A new dependency still needs its docs/DECISIONS.md entry. Every update waits a week after its release (cooldown),
# so a hijacked release is likely caught by others before it reaches us. CI runs on each pull request.
version: 2
updates:
  # The SHA-pinned actions in .github/workflows (the "# vX.Y.Z" comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  # The Android app's libraries, Gradle plugins and the Gradle wrapper (android/gradle/libs.versions.toml).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      android-minor-and-patch:
        update-types: [minor, patch]

  # CI's Python tools, pinned with hashes (.github/requirements).
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
