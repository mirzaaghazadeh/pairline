name: iOS

# Builds and tests the iPhone app on a simulator, then builds Release and runs the policy checks.
# Runs on pull requests and on demand only while the repo is private (macOS minutes cost 10x, D-022).
# Switch to every push to main when the repo goes public.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'protocol/**'
      - '.github/workflows/ios.yml'
      - '.github/scripts/ios-policy-check.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          udid="$(xcrun simctl list -j devices available | python3 -I -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator available")')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Ad-hoc signing ("Sign to Run Locally", no certificate or team): the tests use the Keychain, which fails
      # with errSecMissingEntitlement in an unsigned simulator app.
      # StoreKitTests don't run here: on GitHub's runners (and on a freshly made simulator) the local StoreKit session
      # serves the products and then never finishes a purchase, so the first purchase test hung until the job's time
      # limit (2026-11-27). They run locally before every release (AGENTS.md).
      - name: Build and test (Debug)
        env:
          # Passed to the tests as CI: StoreKitTests would also skip when the runner can't serve StoreKit products.
          TEST_RUNNER_CI: 'true'
          SIMULATOR: ${{ steps.sim.outputs.udid }}
        run: >
          xcodebuild -scheme Pairline -destination "id=$SIMULATOR"
          -derivedDataPath build -resultBundlePath build/Tests.xcresult
          -skip-testing:PairlineTests/StoreKitTests
          CODE_SIGN_IDENTITY=- test

      - name: Build Release
        run: >
          xcodebuild -scheme Pairline -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Policy checks (Release app)
        run: ../.github/scripts/ios-policy-check.sh build/Build/Products/Release-iphonesimulator/Pairline.app

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ github.sha }}
          path: ios/build/Tests.xcresult
          retention-days: 7
