name: Android

# Every push and pull request that touches the Android app: build, unit tests, lint, policy checks.
# The debug APK is kept as an artifact for testing on real phones.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android-policy-check.sh'
      - '.github/scripts/network-code-check.sh'
      - '.github/scripts/trackers-scan.py'
  pull_request:
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android-policy-check.sh'
      - '.github/scripts/network-code-check.sh'
      - '.github/scripts/trackers-scan.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TOOLS: 37.0.0
  # Pairing with Wireless debugging is native code (D-054); keep in step with android/app/build.gradle.kts.
  NDK: 27.1.12297006
  CMAKE: 3.22.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install build-tools ${{ env.BUILD_TOOLS }}, NDK ${{ env.NDK }} and CMake ${{ env.CMAKE }}
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS" ] || yes | "$sdk" "build-tools;$BUILD_TOOLS" > /dev/null
          [ -d "$ANDROID_HOME/ndk/$NDK" ] || yes | "$sdk" "ndk;$NDK" > /dev/null
          [ -d "$ANDROID_HOME/cmake/$CMAKE" ] || yes | "$sdk" "cmake;$CMAKE" > /dev/null

      - name: Build, test and lint
        run: ./gradlew assembleDebug assembleRelease test lint

      - name: Policy checks (release APK)
        run: ../.github/scripts/android-policy-check.sh app/build/outputs/apk/release/app-release-unsigned.apk release

      # εxodus's tracker signatures on every build, so a tracker is caught in its pull request, not at release (D-100).
      - name: No trackers (εxodus signatures)
        run: >
          python3 -I ../.github/scripts/trackers-scan.py --fail-on-trackers
          app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/trackers.md"

      - name: Network code stays in update/, link/wifi/ and netshare/ (D-041)
        run: ../.github/scripts/network-code-check.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pairline-bridge-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7
