# XcodeGen spec for the Pairline iPhone app. Generate the project with `xcodegen generate`;
# the .xcodeproj is not committed (see ../.gitignore).
name: Pairline

options:
  bundleIdPrefix: app.pairline
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Matches the App Store version in App Store Connect. Every upload needs a new build number (docs/RELEASING.md).
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "31"
    # The maintainer's team (forks: set your own to run on a device). CI builds without signing.
    DEVELOPMENT_TEAM: "7Y68TERDUC"
    CODE_SIGN_STYLE: Automatic
    # iPhone and iPad (D-034). XcodeGen's iOS app preset sets "1,2" on the target anyway; this says so explicitly.
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    # The iPad app also runs on Apple Silicon Macs (D-076); the App Store side is a setting in App Store Connect.
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    STRING_CATALOG_GENERATE_SYMBOLS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Pairline:
    type: application
    platform: iOS
    sources:
      - path: Pairline
        excludes:
          - "Store/Pairline.storekit"
      - path: Pairline/Store/Pairline.storekit
        buildPhase: none
      - path: Shared
      - path: LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pairline.ios
        PRODUCT_NAME: Pairline
        INFOPLIST_FILE: Pairline/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pairline/Pairline.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    dependencies:
      - target: PairlineWidget
        embed: true
        codeSign: true
      - target: PairlineShare
        embed: true
        codeSign: true
      - target: PairlineNotifications
        embed: true
        codeSign: true
      # Live Activities (D-053) need iOS 16.1+; weak so the app still launches on iOS 16.0.
      - sdk: ActivityKit.framework
        weak: true
      - sdk: CallKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: StoreKit.framework
      - sdk: VisionKit.framework
      - sdk: libsqlite3.tbd

  PairlineWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PairlineWidget
      - path: Shared
      - path: LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pairline.ios.widget
        PRODUCT_NAME: PairlineWidget
        INFOPLIST_FILE: PairlineWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PairlineWidget/PairlineWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
        weak: true

  # "Send to bridge phone" in the share sheet (M5, D-045). It only copies the shared files into the app group's
  # outbox; the app sends them over the Wi-Fi link.
  PairlineShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PairlineShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pairline.ios.share
        PRODUCT_NAME: PairlineShare
        INFOPLIST_FILE: PairlineShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: PairlineShare/PairlineShare.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: UniformTypeIdentifiers.framework

  # Remote mode (D-092): unseals alert-mailbox records pushed by CloudKit and shows them. It uses only the protocol
  # and Keychain code it needs, and no network.
  PairlineNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: PairlineNotifications
      - path: Shared/RemoteInbox.swift
      - path: Shared/SharedOutbox.swift
      - path: Pairline/Protocol/Bytes.swift
      - path: Pairline/Protocol/Frames.swift
      - path: Pairline/Protocol/SessionCrypto.swift
      - path: Pairline/Remote/MailboxCrypto.swift
      - path: Pairline/Identity/Keychain.swift
      - path: Pairline/Messages/OTPDetector.swift
      - path: Pairline/Data/PhoneNumber.swift
      - path: Pairline/Data/ContactNames.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pairline.ios.notifications
        PRODUCT_NAME: PairlineNotifications
        INFOPLIST_FILE: PairlineNotifications/Info.plist
        CODE_SIGN_ENTITLEMENTS: PairlineNotifications/PairlineNotifications.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: CloudKit.framework
      - sdk: UserNotifications.framework

  PairlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PairlineTests
      - path: ../protocol/test-vectors/v0.json
        buildPhase: resources
      - path: ../protocol/test-vectors/v1-remote.json
        buildPhase: resources
      - path: Pairline/Store/Pairline.storekit
        buildPhase: resources
    dependencies:
      - target: Pairline
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pairline.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  # The accessibility audit behind the App Store labels (D-096): run by tools/accessibility-audit.sh, never by CI.
  PairlineAccessibilityTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PairlineAccessibilityTests
    dependencies:
      - target: Pairline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pairline.ios.accessibilitytests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pairline

schemes:
  Accessibility:
    build:
      targets:
        Pairline: all
        PairlineAccessibilityTests: [test]
    test:
      config: Debug
      targets:
        - PairlineAccessibilityTests
  Pairline:
    build:
      targets:
        Pairline: all
        PairlineTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Pairline/Store/Pairline.storekit
    test:
      config: Debug
      targets:
        - PairlineTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
